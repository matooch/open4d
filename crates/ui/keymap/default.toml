command = "view.set_view"
args = { view = "perspective" }

[[bind]]
chord = "Mod+2"
command = "view.set_view"
args = { view = "front" }

[[bind]]
chord = "Mod+3"
command = "view.set_view"
args = { view = "right" }

[[bind]]
