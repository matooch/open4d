# Default key map (docs/specs/UI.md §14). Observed in the reference app, GUI session G2
# item 1 (docs/parity/GUI-SESSIONS.md), for every action the session listed; the shading keys,
# the Alt+digit mode keys, Mod+1 .. 7 views, Mod+M, Q, L, Shift+S, Shift+M, the marker jumps,
# Space and the palette key are ours (parity-pending G2 / G1).
# A chord with a space is a two-key sequence: `M T` presses M, then T (UI.md §14.7).
# Bare 1 / 2 / 3 are the navigation hold keys (owner note N1), so no bare digit is bound
# here; E / R / T are move / rotate / scale (owner note N2, observed).
# `Mod` is Cmd on macOS and Ctrl elsewhere. Users override chords in the settings file.
version = 1

# File
[[bind]]
chord = "Mod+O"
command = "file.open_dialog"

[[bind]]
chord = "Mod+S"
command = "file.save_dialog"

[[bind]]
chord = "Mod+Shift+S"
command = "file.save_as_dialog"

# Edit: undo / redo (observed; Undo View and Redo View, Mod+Shift+Z / Mod+Shift+Y, have no command yet)
[[bind]]
chord = "Mod+Z"
command = "edit.undo"

[[bind]]
chord = "Mod+Y"
command = "edit.redo"

# Delete: Backspace and Delete (observed). Rename has no key; it is the object manager's double-click and menu entry (parity-pending G1)
[[bind]]
chord = "Delete"
command = "object.delete"

[[bind]]
chord = "Backspace"
command = "object.delete"

# Select
[[bind]]
chord = "Mod+A"
command = "select.all"

[[bind]]
chord = "Mod+Shift+A"
command = "select.none"

[[bind]]
chord = "U I"
command = "select.invert"

[[bind]]
chord = "U Y"
command = "select.grow"

[[bind]]
chord = "U K"
command = "select.shrink"

[[bind]]
chord = "U W"
command = "select.connected"

[[bind]]
chord = "U L"
command = "select.loop"

[[bind]]
chord = "U B"
command = "select.ring"

# Modes: the reference has no default mode keys; Alt+1 .. 4 are ours, an extra (parity-pending G2)
[[bind]]
chord = "Alt+1"
command = "select.mode"
args = { mode = "model" }

[[bind]]
chord = "Alt+2"
command = "select.mode"
args = { mode = "points" }

[[bind]]
chord = "Alt+3"
command = "select.mode"
args = { mode = "edges" }

[[bind]]
chord = "Alt+4"
command = "select.mode"
args = { mode = "polys" }

# Make Editable (observed)
[[bind]]
chord = "C"
command = "mesh.make_editable"

# Group (observed; Ungroup, Shift+G, has no command yet)
[[bind]]
chord = "Alt+G"
command = "object.group"

# Command palette (brief 159; ours)
[[bind]]
chord = "Mod+Shift+P"
command = "ui.command_palette"

