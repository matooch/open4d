# Default key map (docs/specs/UI.md §14). Our own design, parity-pending G2
# (docs/parity/GUI-SESSIONS.md): common DCC conventions where they do not collide.
# `Mod` is Cmd on macOS and Ctrl elsewhere. Users override chords in the settings file.
version = 1

# File
[[bind]]
chord = "Mod+O"
command = "file.open_dialog"

[[bind]]
chord = "Mod+S"
command = "file.save_dialog"

[[bind]]
chord = "Mod+Shift+S"
command = "file.save_as_dialog"

# Edit
[[bind]]
chord = "Mod+Z"
command = "edit.undo"

[[bind]]
chord = "Mod+Shift+Z"
command = "edit.redo"

[[bind]]
chord = "Mod+Y"
command = "edit.redo"

[[bind]]
chord = "Delete"
command = "object.delete"

[[bind]]
chord = "F2"
command = "object.begin_rename"

# Select
[[bind]]
chord = "Mod+A"
command = "select.all"

[[bind]]
chord = "Mod+Shift+A"
command = "select.none"

[[bind]]
chord = "Mod+I"
command = "select.invert"

[[bind]]
chord = "Alt+1"
command = "select.mode"
args = { mode = "model" }

[[bind]]
chord = "Alt+2"
command = "select.mode"
args = { mode = "points" }

[[bind]]
chord = "Alt+3"
command = "select.mode"
args = { mode = "edges" }

[[bind]]
chord = "Alt+4"
command = "select.mode"
args = { mode = "polys" }

# Mesh
[[bind]]
chord = "Mod+Shift+E"
command = "mesh.make_editable"

# View: shading
[[bind]]
chord = "1"
command = "view.shading"
args = { mode = "smooth" }

[[bind]]
chord = "2"
command = "view.shading"
args = { mode = "flat" }

[[bind]]
chord = "3"
command = "view.shading"
args = { mode = "wire" }

[[bind]]
chord = "4"
command = "view.shading"
args = { mode = "smooth_wire" }

[[bind]]
chord = "5"
command = "view.shading"
args = { mode = "flat_wire" }

# View: more display modes, the four-view layout (brief 143)
[[bind]]
chord = "6"
command = "view.shading"
args = { mode = "quick" }

[[bind]]
chord = "7"
command = "view.shading"
args = { mode = "constant" }

[[bind]]
chord = "8"
command = "view.shading"
args = { mode = "hidden_line" }

[[bind]]
chord = "9"
command = "view.shading"
args = { mode = "bounding_box" }

[[bind]]
chord = "F4"
command = "view.layout"

[[bind]]
chord = "Mod+M"
command = "view.maximize"

# View: framing and named views (brief 153)
[[bind]]
chord = "H"
command = "view.frame_all"

[[bind]]
chord = "S"
command = "view.frame_selected"

[[bind]]
chord = "Mod+1"
command = "view.set_view"
args = { view = "perspective" }

[[bind]]
chord = "Mod+2"
command = "view.set_view"
args = { view = "front" }

[[bind]]
chord = "Mod+3"
command = "view.set_view"
args = { view = "right" }

[[bind]]
chord = "Mod+4"
command = "view.set_view"
args = { view = "top" }

[[bind]]
chord = "Mod+5"
command = "view.set_view"
args = { view = "back" }

[[bind]]
chord = "Mod+6"
command = "view.set_view"
args = { view = "left" }

[[bind]]
chord = "Mod+7"
command = "view.set_view"
args = { view = "bottom" }

# Gizmo
[[bind]]
chord = "W"
command = "view.gizmo_mode"
args = { mode = "move" }

[[bind]]
chord = "E"
command = "view.gizmo_mode"
args = { mode = "rotate" }

[[bind]]
chord = "R"
command = "view.gizmo_mode"
args = { mode = "scale" }

[[bind]]
chord = "Q"
command = "view.gizmo_space"

# Snapping and axis mode (brief 032)
[[bind]]
chord = "Shift+S"
command = "snap.toggle"

[[bind]]
chord = "L"
command = "edit.axis_mode"

# Animation
[[bind]]
chord = "K"
command = "key.record"

[[bind]]
chord = "Shift+K"
command = "key.autokey"

[[bind]]
chord = "Space"
command = "timeline.toggle_play"
scope = "viewport"

[[bind]]
chord = "Comma"
command = "timeline.step"
args = { delta = -1 }

[[bind]]
chord = "Period"
command = "timeline.step"
args = { delta = 1 }

[[bind]]
chord = "Shift+Comma"
command = "key.jump"
args = { forward = false }

[[bind]]
chord = "Shift+Period"
command = "key.jump"
args = { forward = true }

[[bind]]
chord = "M"
command = "marker.add"

[[bind]]
chord = "Alt+Comma"
command = "marker.jump"
args = { forward = false }

[[bind]]
chord = "Alt+Period"
command = "marker.jump"
args = { forward = true }
