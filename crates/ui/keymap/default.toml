# Snapping and axis mode (brief 032; ours)
[[bind]]
chord = "Shift+S"
command = "snap.toggle"

[[bind]]
chord = "L"
command = "edit.axis_mode"

# Playback and recording (observed). Play backwards F6 and Record Animated Alt+F9 have no command yet; Render View Mod+R and Render to Picture Viewer Shift+R have no command yet
[[bind]]
chord = "F8"
command = "timeline.play"

[[bind]]
chord = "F7"
command = "timeline.stop"

[[bind]]
chord = "F9"
command = "key.record"

[[bind]]
chord = "Mod+F9"
command = "key.autokey"

[[bind]]
chord = "G"
command = "timeline.step"
args = { delta = 1 }

[[bind]]
chord = "F"
command = "timeline.step"
args = { delta = -1 }

[[bind]]
chord = "Mod+G"
command = "key.jump"
args = { forward = true }

[[bind]]
chord = "Mod+F"
command = "key.jump"
args = { forward = false }

# Space plays in the viewport (ANIM.md §2.7; observed in the timeline)
[[bind]]
chord = "Space"
command = "timeline.toggle_play"
scope = "viewport"

# Markers (brief 094; ours: bare M is the mesh prefix)
[[bind]]
chord = "Shift+M"
command = "marker.add"

[[bind]]
chord = "Alt+Comma"
command = "marker.jump"
args = { forward = false }

[[bind]]
chord = "Alt+Period"
command = "marker.jump"
args = { forward = true }

