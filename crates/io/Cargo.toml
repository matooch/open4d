[package]
name = "forge-io"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "File formats: Wavefront OBJ import and export (docs/specs/IO.md)."

[dependencies]
forge-core = { path = "../core" }
forge-generators = { path = "../generators" }
forge-geometry = { path = "../geometry" }
forge-material = { path = "../material" }
forge-rig = { path = "../rig" }
forge-anim = { path = "../anim" }
base64 = "0.22"
ufbx = "0.11.5"
glam = "0.34"
gltf = { version = "1.4", default-features = false, features = ["names", "utils"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
forge-modifiers = { path = "../modifiers" }
forge-parity-harness = { path = "../parity-harness" }
toml = "1"

[lints]
workspace = true
