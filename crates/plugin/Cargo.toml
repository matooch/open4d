[package]
name = "forge-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rhai plugin packages: a folder with a manifest that registers node types and commands (docs/specs/PLUGINS.md)."

[dependencies]
forge-app = { path = "../app" }
forge-command = { path = "../command" }
forge-core = { path = "../core" }
forge-geometry = { path = "../geometry" }
forge-script = { path = "../script" }
glam = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
