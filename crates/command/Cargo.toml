[package]
name = "forge-command"
version.workspace = true
edition.workspace = true
description = "Command registry: every user action as a named, typed, undoable command (docs/specs/COMMANDS.md)."

[dependencies]
forge-core = { path = "../core" }
forge-generators = { path = "../generators" }
forge-io = { path = "../io" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
forge-modifiers = { path = "../modifiers" }

[lints]
workspace = true
