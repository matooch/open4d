[package]
name = "forge-viewport"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Viewport: camera navigation, picking, snapping, grid, gizmos and the wgpu renderer."

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
forge-geometry = { path = "../geometry" }
forge-modeling = { path = "../modeling" }
glam = "0.34"
pollster = "1"
wgpu = "30"

[dev-dependencies]
png = "0.18"
# Benchmarks (docs/specs/VIEWPORT.md §10.10); no plotting or parallel features, so the
# dependency set stays small and permissive (deny.toml).
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "performance"
harness = false

[lints]
workspace = true
