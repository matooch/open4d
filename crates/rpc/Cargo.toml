[package]
name = "forge-rpc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "JSON-RPC 2.0 server for the running editor and a Rust client (docs/specs/RPC.md)."

[dependencies]
forge-app = { path = "../app" }
forge-command = { path = "../command" }
forge-core = { path = "../core" }
forge-platform = { path = "../platform" }
forge-plugin = { path = "../plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[lints]
workspace = true
