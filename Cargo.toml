[workspace]
resolver = "3"
members = ["crates/*", "apps/studio", "apps/forge", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# Smaller debug info keeps target/ (and CI caches) a fraction of the size; backtraces
# still have file and line numbers. Dependencies carry no debug info at all.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
