name: release

# Builds installable packages for Linux, macOS and Windows (brief 176, DECISIONS D11).
#   - Push a tag `v*` (it must equal the workspace.package version): builds everything and
#     publishes a GitHub Release with the packages, SHA256SUMS and a generated changelog.
#   - Run manually (workflow_dispatch): builds everything and uploads workflow artifacts.
#     With dry_run = true (default) nothing is published; set it to false to publish a
#     Release for the selected ref (the version still comes from Cargo.toml, tag name is
#     `v<version>`).
# Packaging scripts live in scripts/release/ and can be run locally (docs/RELEASING.md).
# Signing and notarization (brief 177, docs/RELEASING.md): every step is gated on a secrets check
# and skipped with "signing skipped: <reason>"; unsigned artifacts are always uploaded.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and upload artifacts only; do not create a GitHub Release"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for the changelog
      - id: v
        name: Read workspace version and check the tag
        run: |
          version=$(sh scripts/release/version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version v$version" >&2
            exit 1
          fi
      - name: Generate changelog
        run: |
          mkdir -p dist
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            sh scripts/release/changelog.sh "$GITHUB_REF_NAME" > dist/CHANGELOG.md
          else
            sh scripts/release/changelog.sh HEAD > dist/CHANGELOG.md
          fi
          cat dist/CHANGELOG.md
      - uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: dist/CHANGELOG.md

  linux:
    needs: prepare
    # Oldest hosted LTS image, so the binaries run on older glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: System libraries (egui/winit/wgpu need xkbcommon, X11, Wayland)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxcb1-dev \
            libxcb-xkb-dev libwayland-dev libgl1-mesa-dev
      - run: cargo build --release --locked -p forge-studio -p forge-cli -p forge-mcp -p forge-rpc
      - name: Package (tar.gz + AppImage)
        run: sh scripts/release/package-linux.sh target/release
      - id: gpg_gate
        name: Check Linux signing secrets
        run: |
          if [ "${{ secrets.LINUX_GPG_PRIVATE_KEY != '' }}" = "true" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "signing skipped: LINUX_GPG_PRIVATE_KEY is not set"
          fi
      - name: Sign Linux packages (detached GPG signature)
        if: steps.gpg_gate.outputs.sign == 'true'
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/forge-gnupg"
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
          for f in dist/*.AppImage dist/*.tar.gz; do
            printf '%s' "$LINUX_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --armor --detach-sign --output "$f.asc" "$f"
          done
      - name: Cleanup Linux signing material (gpg_gate)
        if: always() && steps.gpg_gate.outputs.sign == 'true'
        run: |
          gpgconf --kill gpg-agent || true
          rm -rf "$RUNNER_TEMP/forge-gnupg"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.asc
          if-no-files-found: error

  macos:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build both architectures
        run: |
          for t in x86_64-apple-darwin aarch64-apple-darwin; do
            cargo build --release --locked --target "$t" \
              -p forge-studio -p forge-cli -p forge-mcp -p forge-rpc
          done
      - id: mac_gate
        name: Check macOS signing secrets
        run: |
          if [ "${{ secrets.MACOS_CERT_P12 != '' && secrets.MACOS_CERT_PASSWORD != '' }}" = "true" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "signing skipped: MACOS_CERT_P12 / MACOS_CERT_PASSWORD are not set"
          fi
          if [ "${{ secrets.MACOS_CERT_P12 != '' && secrets.MACOS_CERT_PASSWORD != '' && secrets.MACOS_NOTARY_KEY_P8 != '' && secrets.MACOS_NOTARY_KEY_ID != '' && secrets.MACOS_NOTARY_ISSUER_ID != '' }}" = "true" ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            echo "signing skipped: notarization needs MACOS_NOTARY_KEY_P8, MACOS_NOTARY_KEY_ID, MACOS_NOTARY_ISSUER_ID and the signing certificate"
          fi
      - name: Import macOS certificate into a temporary keychain
        if: steps.mac_gate.outputs.sign == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY_SECRET: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/forge-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/forge-cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/forge-cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Make the temporary keychain the only one searched (restored by deleting it).
          security list-keychains -d user -s "$KEYCHAIN"
          IDENTITY="$MACOS_SIGN_IDENTITY_SECRET"
          if [ -z "$IDENTITY" ]; then
            IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" |
              sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)
          fi
          if [ -z "$IDENTITY" ]; then
            echo "no Developer ID Application identity in the imported certificate" >&2
            exit 1
          fi
          {
            echo "MACOS_KEYCHAIN=$KEYCHAIN"
            echo "MACOS_SIGN_IDENTITY=$IDENTITY"
          } >> "$GITHUB_ENV"
      - name: Package (universal2 .app in .dmg)
        # The package script signs the .app through scripts/release/sign-hooks.sh when
        # MACOS_SIGN_IDENTITY was exported by the import step; otherwise it is a no-op.
        run: sh scripts/release/package-macos.sh target/x86_64-apple-darwin/release target/aarch64-apple-darwin/release
      - name: Sign the dmg (codesign)
        if: steps.mac_gate.outputs.sign == 'true'
        run: |
          for f in dist/*.dmg; do
            codesign --force --timestamp --keychain "$MACOS_KEYCHAIN" --sign "$MACOS_SIGN_IDENTITY" "$f"
            codesign --verify --verbose=2 "$f"
          done
      - name: Notarize and staple the dmg (notarytool, stapler)
        if: steps.mac_gate.outputs.notarize == 'true'
        env:
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          printf '%s' "$MACOS_NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/forge-notary.p8"
          for f in dist/*.dmg; do
            xcrun notarytool submit "$f" --wait --timeout 30m \
              --key "$RUNNER_TEMP/forge-notary.p8" --key-id "$MACOS_NOTARY_KEY_ID" \
              --issuer "$MACOS_NOTARY_ISSUER_ID"
            xcrun stapler staple "$f"
            xcrun stapler validate "$f"
          done
      - name: Cleanup macOS signing material (mac_gate)
        if: always() && steps.mac_gate.outputs.sign == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/forge-signing.keychain-db" || true
          rm -rf "$RUNNER_TEMP/forge-cert.p12" "$RUNNER_TEMP/forge-notary.p8"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal2
          path: |
            dist/*.dmg
            dist/*-cli.tar.gz
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p forge-studio -p forge-cli -p forge-mcp -p forge-rpc
      - id: win_gate
        name: Check Windows signing secrets
        shell: bash
        run: |
          if [ "${{ secrets.WINDOWS_CERT_PFX != '' && secrets.WINDOWS_CERT_PASSWORD != '' }}" = "true" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "signing skipped: WINDOWS_CERT_PFX / WINDOWS_CERT_PASSWORD are not set"
          fi
      - name: Decode Windows certificate (signtool input)
        if: steps.win_gate.outputs.sign == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "forge-cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          "WINDOWS_CERT_FILE=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Package (zip; exes signed when a certificate was decoded)
        shell: pwsh
        # sign-hooks.ps1 skips (logs "signing skipped") unless WINDOWS_CERT_FILE is set.
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./scripts/release/package-windows.ps1 -BinDir target\release -Dist dist
      - name: Cleanup Windows signing material (win_gate)
        if: always() && steps.win_gate.outputs.sign == 'true'
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP "forge-cert.pfx")
      # MSI (cargo-wix / WiX) is a documented follow-up: docs/RELEASING.md.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: [prepare, linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-parts
          merge-multiple: true
      - name: Collect and checksum
        run: |
          mkdir -p dist
          cp dist-parts/* dist/
          sh scripts/release/checksums.sh dist
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/*
      - name: Publish GitHub Release
        # Tag pushes always publish; manual runs publish only when dry_run is false.
        if: github.event_name == 'push' || inputs.dry_run == false
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.prepare.outputs.version) }}
          name: Forge3D ${{ needs.prepare.outputs.version }}
          body_path: dist/CHANGELOG.md
          files: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.dmg
            dist/*.zip
            dist/*.asc
            dist/SHA256SUMS
          fail_on_unmatched_files: false
