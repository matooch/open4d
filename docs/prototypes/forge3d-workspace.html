<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge3D workspace prototype</title>
<style>
  html {background:#11151b}
  body {margin:0;padding:clamp(6px,2vw,24px)}
  main {max-width:1440px;margin:auto}
</style>
</head>
<body>
<main>
<div id="forge-studio-preview" aria-label="Forge3D workspace concept">
<style>
#forge-studio-preview {
  --window:#171b21; --panel:#20262e; --view:#252c35; --input:#181d24; --line:#343d49;
  --text:#e8edf2; --muted:#a7b2c0; --mint:#73d6bc; --select:#f3b36b; --record:#f17a80;
  color-scheme:dark; background:var(--window); color:var(--text);
  font:13px/1.42 system-ui,sans-serif; border:1px solid var(--line); border-radius:9px;
  overflow:hidden; isolation:isolate; container-type:inline-size;
}
#forge-studio-preview *, #forge-studio-preview *::before {box-sizing:border-box}
#forge-studio-preview [hidden] {display:none!important}
#forge-studio-preview button, #forge-studio-preview input, #forge-studio-preview select {
  color:inherit; font:inherit; border:1px solid transparent; border-radius:4px; background:none; min-width:0;
}
#forge-studio-preview button {padding:4px 8px; white-space:nowrap}
#forge-studio-preview button:not(:disabled):hover {background:#ffffff0e}
#forge-studio-preview button:focus-visible, #forge-studio-preview input:focus-visible,
#forge-studio-preview select:focus-visible {outline:2px solid var(--mint); outline-offset:-2px}
#forge-studio-preview button[aria-pressed=true] {background:color-mix(in srgb,var(--mint) 13%,transparent); color:var(--mint)}
#forge-studio-preview button:disabled {opacity:.4}
#forge-studio-preview i {font-style:normal}
#forge-studio-preview svg {height:15px;width:15px;flex:none;vertical-align:middle;stroke-width:1.65}
#forge-studio-preview .bar {display:flex;align-items:center;gap:4px;padding:4px 9px;min-height:35px;flex-wrap:wrap}
#forge-studio-preview .space {flex:1}
#forge-studio-preview .identity {border-bottom:1px solid var(--line); padding-left:12px; color:var(--muted); font-size:12px}
#forge-studio-preview .brand {color:var(--text);font-weight:730;letter-spacing:.025em;display:flex;align-items:center;gap:7px}
#forge-studio-preview .brand svg {color:var(--mint)}
#forge-studio-preview .name {margin-inline:auto; padding-inline:12px}
#forge-studio-preview .workspace {border-bottom:1px solid var(--line);background:#1c2229}
#forge-studio-preview .workspace .worktab {color:var(--muted);border-radius:0;border-bottom:2px solid transparent}
#forge-studio-preview .workspace .worktab[aria-pressed=true] {background:none;color:var(--text);border-bottom-color:var(--mint)}
#forge-studio-preview .workspace .create {border-color:var(--line);background:var(--panel)}
#forge-studio-preview .create svg {margin-right:3px;color:#9cbaff}
#forge-studio-preview [data-action=cloner] svg {color:var(--mint)}
#forge-studio-preview .body {display:grid;grid-template-columns:minmax(0,1fr) clamp(224px,27%,292px)}
#forge-studio-preview .main {min-width:0;background:var(--panel)}
#forge-studio-preview .viewbar {border-bottom:1px solid var(--line);font-size:12px}
#forge-studio-preview .mode {display:inline-flex;gap:1px;padding:2px;background:var(--input);border-radius:5px}
#forge-studio-preview .mode button {padding:2px 6px}
#forge-studio-preview .workarea {display:grid;grid-template-columns:42px minmax(0,1fr)}
#forge-studio-preview .rail {background:var(--panel);border-right:1px solid var(--line);padding:7px 5px;display:flex;flex-direction:column;gap:5px}
#forge-studio-preview .rail button {height:31px;padding:0}
#forge-studio-preview .rule {height:1px;background:var(--line);margin:2px}
#forge-studio-preview .viewport {position:relative;height:clamp(300px,46cqw,455px);overflow:hidden;background:var(--view)}
#forge-studio-preview .animating .viewport {height:clamp(235px,34cqw,340px)}
#forge-studio-preview .viewport canvas {width:100%;height:100%;display:block;touch-action:pan-y}
#forge-studio-preview .hud {position:absolute;pointer-events:none;color:var(--muted);font-size:11px;left:12px;top:10px}
#forge-studio-preview .grid-label {position:absolute;left:12px;bottom:9px;pointer-events:none;color:var(--muted);font-size:11px}
#forge-studio-preview aside {border-left:1px solid var(--line);background:var(--panel);min-width:0;display:grid;grid-template-rows:minmax(195px,42%) 1fr}
#forge-studio-preview .manager {min-width:0}
#forge-studio-preview .manager + .manager {border-top:1px solid var(--line)}
#forge-studio-preview .panel-title {margin:0;color:var(--text);font-size:13px;font-weight:660}
#forge-studio-preview .panel-head {background:#262d36;border-bottom:1px solid var(--line);min-height:34px}
#forge-studio-preview .filter {margin:9px;width:calc(100% - 18px);padding:5px 7px;background:var(--input);border-color:var(--line);font-size:12px}
#forge-studio-preview .tree {padding:0 6px 8px;min-height:116px}
#forge-studio-preview .tree-row {display:flex;min-height:28px;align-items:center;gap:1px;border-left:2px solid transparent;border-radius:3px;background:#ffffff03}
#forge-studio-preview .tree-row:nth-child(2n) {background:transparent}
#forge-studio-preview .tree-row.child {margin-left:14px;position:relative}
#forge-studio-preview .tree-row.child::before {content:"";border-left:1px solid var(--line);border-bottom:1px solid var(--line);position:absolute;left:-10px;top:0;width:10px;height:50%}
#forge-studio-preview .tree-row.selected {background:color-mix(in srgb,var(--select) 10%,transparent);border-left-color:var(--select)}
#forge-studio-preview .tree-row .item {text-align:left;flex:1;overflow:hidden;text-overflow:ellipsis;padding-inline:3px}
#forge-studio-preview .tree-row .item svg {margin-right:4px}
#forge-studio-preview .tree-row.selected .item {color:var(--select)}
#forge-studio-preview .tree-row .toggle {min-width:23px;color:var(--muted);padding:3px}
#forge-studio-preview .tree-row .toggle svg {height:13px;width:13px}
#forge-studio-preview .mesh {color:#a8bfff}
#forge-studio-preview .group {color:#79cebb}
#forge-studio-preview .tag {color:var(--muted);font-size:11px}
#forge-studio-preview .object-head {padding:10px 10px 5px;display:flex;align-items:center;gap:6px;font-weight:620}
#forge-studio-preview .object-head small {margin-left:auto;color:var(--muted);font-weight:400;font-size:11px}
#forge-studio-preview .tabs {display:flex;gap:3px;flex-wrap:wrap;padding:4px 8px 7px;border-bottom:1px solid var(--line);font-size:12px}
#forge-studio-preview .attrs {padding:10px 9px;min-height:145px}
#forge-studio-preview .field {display:grid;grid-template-columns:66px minmax(0,1fr) 22px;align-items:center;min-height:31px;gap:4px;font-size:12px}
#forge-studio-preview .field label, #forge-studio-preview .field > span:first-child {color:var(--muted)}
#forge-studio-preview .field .xyz {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}
#forge-studio-preview .field .xyz label {display:flex;gap:2px;align-items:center;min-width:0}
#forge-studio-preview .field input, #forge-studio-preview .field select, #forge-studio-preview .frame {
  border-color:var(--line);background:var(--input);padding:3px 4px;font-variant-numeric:tabular-nums;width:100%;
}
#forge-studio-preview .field .key {color:var(--muted);padding:0;min-height:23px;font-size:15px}
#forge-studio-preview .field .key[data-keyed=true] {color:var(--select)}
#forge-studio-preview .transport {border-top:1px solid var(--line);background:var(--panel)}
#forge-studio-preview .transport .bar {column-gap:2px}
#forge-studio-preview .transport .bar button {min-width:28px;padding-inline:5px}
#forge-studio-preview .transport .frame {max-width:49px}
#forge-studio-preview .transport [data-action=auto][aria-pressed=true] {color:var(--record);background:#f17a8025}
#forge-studio-preview .track-area {display:grid;grid-template-columns:minmax(0,1fr);border-top:1px solid var(--line)}
#forge-studio-preview .track-names {border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch;padding-top:55px;background:#1c2229}
#forge-studio-preview .track-names button {text-align:left;font-size:11px}
#forge-studio-preview .scale {padding:0 10px 0;overflow:hidden}
#forge-studio-preview .ticks {display:flex;justify-content:space-between;position:relative;padding:5px 0 0;color:var(--muted);font:11px/1.4 ui-monospace,monospace}
#forge-studio-preview .ruler {width:100%;margin:0;height:16px;accent-color:var(--mint);cursor:ew-resize;display:block}
#forge-studio-preview .range {border-top:1px solid var(--line);color:var(--muted);font-size:11px;min-height:25px}
#forge-studio-preview .graph {width:100%;height:145px;display:block;cursor:crosshair;touch-action:pan-y}
#forge-studio-preview .footer {border-top:1px solid var(--line);font-size:11px;color:var(--muted);min-height:27px}
#forge-studio-preview .empty {padding:10px;color:var(--muted);font-size:12px}
#forge-studio-preview .empty button {border-color:var(--line)}
@container (max-width:640px) {
  #forge-studio-preview .body {grid-template-columns:minmax(0,1fr)}
  #forge-studio-preview aside {border-left:0;border-top:1px solid var(--line);grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto}
  #forge-studio-preview .manager + .manager {border-top:0;border-left:1px solid var(--line)}
  #forge-studio-preview .viewport {height:285px}
  #forge-studio-preview .field {grid-template-columns:minmax(0,1fr) 23px}
  #forge-studio-preview .field > :first-child {grid-column:1/-1}
  #forge-studio-preview .field .xyz label span {display:none}
}
@container (max-width:390px) {
  #forge-studio-preview .body {display:block}
  #forge-studio-preview aside {display:block}
  #forge-studio-preview .manager + .manager {border-top:1px solid var(--line);border-left:0}
  #forge-studio-preview .track-area {grid-template-columns:85px minmax(0,1fr)}
}
</style>
<header>
  <div class="bar identity"><span class="brand"><i data-icon="boxes" aria-hidden="true"></i> Forge3D</span><span class="name">Orbit Study.forge</span><span>Scene preview</span></div>
  <div class="bar workspace" aria-label="Workspace and creation">
    <button class="worktab" data-work="standard" aria-pressed="true">Standard</button>
    <button class="worktab" data-work="model">Modeling</button>
    <button class="worktab" data-work="animate">Animate</button>
    <span class="space"></span>
    <span class="create-control"><select class="create" data-create aria-label="Add primitive"><option value="">+ Primitive</option><option>Sphere</option><option>Cube</option><option>Torus</option></select></span>
    <button class="create" data-action="cloner"><i data-icon="layers-3" aria-hidden="true"></i> Cloner</button>
  </div>
</header>
<div class="body">
  <div class="main">
    <div class="bar viewbar">
      <span><i data-icon="camera" aria-hidden="true"></i> Perspective</span><span class="space"></span>
      <div class="mode" role="group" aria-label="Component mode">
        <button data-mode="Object" aria-pressed="true">Object</button><button data-mode="Point">Point</button><button data-mode="Edge">Edge</button><button data-mode="Polygon">Polygon</button>
      </div>
      <button data-action="wire" aria-label="Toggle wireframe" title="Wireframe"><i data-icon="box" aria-hidden="true"></i></button>
      <button data-action="grid" aria-label="Toggle grid" title="Grid" aria-pressed="true"><i data-icon="grid-3x3" aria-hidden="true"></i></button>
      <button data-action="fit" aria-label="Frame scene" title="Frame scene"><i data-icon="maximize" aria-hidden="true"></i></button>
    </div>
    <div class="workarea">
      <div class="rail" role="group" aria-label="Viewport tools">
        <button data-tool="Select" aria-label="Select" title="Select"><i data-icon="mouse-pointer-2" aria-hidden="true"></i></button>
        <button data-tool="Move" aria-pressed="true" aria-label="Move" title="Move · E"><i data-icon="move" aria-hidden="true"></i></button>
        <button data-tool="Rotate" aria-label="Rotate" title="Rotate · R"><i data-icon="rotate-cw" aria-hidden="true"></i></button>
        <button data-tool="Scale" aria-label="Scale" title="Scale · T"><i data-icon="scaling" aria-hidden="true"></i></button>
        <div class="rule"></div>
        <button data-action="clear" aria-label="Clear selection" title="Clear selection"><i data-icon="square-dashed" aria-hidden="true"></i></button>
      </div>
      <div class="viewport" aria-label="Scene viewport">
        <canvas class="scene" role="img" aria-label="Perspective view of the Orbit Study scene"></canvas>
        <span class="hud">Default Camera · <span data-shading>Solid</span></span>
        <span class="grid-label">Grid · 50 cm</span>
      </div>
    </div>
    <section class="transport" aria-label="Timeline and animation editors">
      <div class="bar">
        <div class="mode" data-editor-tabs role="group" aria-label="Animation editor" hidden><button data-editor="sheet" aria-pressed="true">Dope Sheet</button><button data-editor="curve">F-Curve</button></div>
        <span class="space"></span>
        <button data-action="start" title="Go to start" aria-label="Go to start"><i data-icon="skip-back" aria-hidden="true"></i></button>
        <button data-action="prev" aria-label="Previous frame" title="Previous frame"><i data-icon="chevron-left" aria-hidden="true"></i></button>
        <button data-action="play" aria-label="Play" title="Play"><i data-icon="play" aria-hidden="true"></i></button>
        <button data-action="next" aria-label="Next frame" title="Next frame"><i data-icon="chevron-right" aria-hidden="true"></i></button>
        <button data-action="end" title="Go to end" aria-label="Go to end"><i data-icon="skip-forward" aria-hidden="true"></i></button>
        <input class="frame" type="number" min="0" max="90" value="30" aria-label="Current frame">
        <button data-action="key" aria-label="Toggle Position X key at current frame" title="Toggle Position X key">◇</button>
        <button data-action="auto" aria-pressed="false" title="Auto-key Position X">Auto-key</button>
      </div>
      <div class="track-area">
        <div class="track-names" data-tracks hidden><button data-track="1" aria-pressed="true">◈ Position X</button></div>
        <div class="scale">
          <div class="ticks" aria-hidden="true"><span>0</span><span>15</span><span>30</span><span>45</span><span>60</span><span>75</span><span>90</span></div>
          <input class="ruler" type="range" min="0" max="90" value="30" aria-label="Scrub scene frame">
          <canvas class="graph" role="img" aria-label="Animation keys or value curve for Position X" hidden></canvas>
        </div>
      </div>
      <div class="bar range"><span>Preview 0–90 f</span><span class="space"></span><span>30 fps</span></div>
    </section>
  </div>
  <aside aria-label="Scene managers">
    <section class="manager">
      <div class="bar panel-head"><h2 class="panel-title">Objects</h2><span class="space"></span><button data-action="scene" title="Toggle empty scene preview">Empty scene</button></div>
      <input class="filter" type="search" placeholder="Find objects" aria-label="Find objects">
      <div class="tree" aria-label="Scene hierarchy"></div>
    </section>
    <section class="manager">
      <div class="bar panel-head"><h2 class="panel-title">Attributes</h2></div>
      <div class="object-head"></div>
      <div class="tabs" aria-label="Attribute tabs"></div>
      <div class="attrs"></div>
    </section>
  </aside>
</div>
<div class="bar footer"><span data-status role="status">Orb selected</span><span class="space"></span><span data-count>4 objects</span></div>
<style>
#forge-studio-preview .animating .track-area {grid-template-columns:124px minmax(0,1fr)}
#forge-studio-preview .workspace select {padding:4px 6px;font-size:12px}
#forge-studio-preview .play-mark {display:inline-flex;width:15px;justify-content:center;font-size:13px}
#forge-studio-preview .field .xyz input::-webkit-inner-spin-button {appearance:none}
@container (max-width:390px) {
  #forge-studio-preview .animating .track-area {grid-template-columns:85px minmax(0,1fr)}
}
</style>

    } else if(param==='pY'||param==='pZ'){object[param[1].toLowerCase()]=value/100;}
    else if(param[0]==='r'||param[0]==='s'&&param.length===2) {
      const key=param[0]==='r'?'rotation':'scale';
      object[key] ||= key==='rotation'?[0,0,0]:[100,100,100];
      object[key]['XYZ'.indexOf(param[1])]=value;
    } else object[param]=param==='size'?clamp(value,5,300)/100:clamp(value,1,300);
    syncFrame();
  });
  graphCanvas.addEventListener('click',event=>setFrame((event.offsetX-5)/(graphCanvas.clientWidth-10)*90));
  let dragging, navKey;
  root.addEventListener('keydown',event=>{
    if(event.target.matches('input,select'))return;
    if('123'.includes(event.key)&&event.key.length===1)navKey=event.key;
    const shortcut={e:'Move',r:'Rotate',t:'Scale'}[event.key.toLowerCase()];
    if(shortcut)by('[data-tool="'+shortcut+'"]').click();
  });
  window.addEventListener('keyup',event=>{if(event.key===navKey)navKey=undefined;});
  window.addEventListener('blur',()=>{navKey=undefined;});
  by('.viewport').tabIndex=0;
  sceneCanvas.addEventListener('pointerdown',event=>{
    by('.viewport').focus({preventScroll:true});
    dragging={x:event.offsetX,y:event.offsetY,lastX:event.offsetX,lastY:event.offsetY,moved:false};
    sceneCanvas.setPointerCapture(event.pointerId);
  });
  sceneCanvas.addEventListener('pointermove',event=>{
    if(!dragging)return;
    if(Math.hypot(event.offsetX-dragging.x,event.offsetY-dragging.y)>4)dragging.moved=true;
    if(!dragging.moved)return;
    const dx=event.offsetX-dragging.lastX,dy=event.offsetY-dragging.lastY;
    if(navKey==='1'){panX+=dx;panY+=dy;}
    else if(navKey==='2'){zoom=clamp(zoom+dx*.006,.4,2.6);}
    else {orbit+=dx*.009;elevation=clamp(elevation+dy*.008,.12,1.1);}
    dragging.lastX=event.offsetX;dragging.lastY=event.offsetY;drawScene();
  });
  sceneCanvas.addEventListener('pointerup',event=>{
    if(dragging&&!dragging.moved) {
      const hit=hitAreas.map(area=>({...area, distance:Math.hypot(event.offsetX-area.point[0],event.offsetY-area.point[1])}))
        .filter(area=>area.distance<area.radius).sort((a,b)=>a.distance-b.distance)[0];
      choose(hit?.id??null);by('[data-status]').textContent=active()?active().name+' selected':'Selection cleared';
    }
    dragging=null;
  });
  sceneCanvas.addEventListener('pointercancel',()=>{dragging=null;});
  new ResizeObserver(()=>{drawScene();drawGraph();}).observe(root);
  renderPanels();syncFrame();
})();
</script>
</div>
</main>
</body>
