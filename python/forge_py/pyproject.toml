[project]
name = "forge-py"
version = "0.1.0"
description = "Pure-Python client for the Forge3D JSON-RPC server (docs/specs/RPC.md)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[tool.hatch.build.targets.wheel]
