description = "A cloner in Grid mode, count 3 x 1 x 3 with size 200 x 200 x 200 cm, holding a cube of size 30; the cloner sits at (0, 300, 0) and carries a dynamic body tag so each clone is its own body, over the default 400 x 400 plane; simulated frame by frame 0 to 90 at 30 fps. Clones 0 and 4 are sampled as global positions; clone 4 is the first clone of the second grid column"
