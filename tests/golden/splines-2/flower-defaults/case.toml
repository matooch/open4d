feature = "splines-2"
observation = "docs/parity/splines-2.md"
description = "Flower spline, all parameters at their R25 defaults"
mesh = "mesh.obj"

[params]
extrude_offset = 20.0
caps = false

[params.input]
type = "flower_spline"
inner_radius = 100.0
outer_radius = 200.0
petals = 8
plane = "xy"
reverse = false
intermediate = "adaptive"
