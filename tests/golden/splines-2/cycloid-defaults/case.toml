feature = "splines-2"
observation = "docs/parity/splines-2.md"
description = "Cycloid spline, all parameters at their R25 defaults"
mesh = "mesh.obj"

[params]
extrude_offset = 20.0
caps = false

[params.input]
type = "cycloid_spline"
