feature = "spline-tools"
observation = "docs/parity/spline-tools.md"
description = "Default Rectangle with Intermediate Points Uniform, Number 8, Extrude offset 100"
mesh = "mesh.obj"

[params]
type = "extrude"
caps = false
extrude_offset = 100.0

[params.input]
type = "rectangle_spline"
width = 400.0
height = 400.0
rounding = false
rounding_radius = 50.0
plane = "xy"
reverse = false
intermediate = "adaptive"
intermediate_number = 8
intermediate_angle = 5.0
intermediate_max_length = 5.0



[import]
scale = 1.0
flip_z = false
