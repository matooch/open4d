feature = "spline-tools"
observation = "docs/parity/spline-tools.md"
description = "Default Profile with Type U Shape, extruded"
mesh = "mesh.obj"

[params]
type = "extrude"
caps = false
extrude_offset = 20.0

[params.input]
type = "profile_spline"
profile_type = "u_shape"
height = 200.0
b = 100.0
s = 20.0
t = 20.0
plane = "xy"
reverse = false
intermediate = "adaptive"
intermediate_number = 8
intermediate_angle = 5.0
intermediate_max_length = 5.0



[import]
scale = 1.0
flip_z = false
