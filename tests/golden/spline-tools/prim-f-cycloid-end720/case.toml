feature = "spline-tools"
observation = "docs/parity/spline-tools.md"
description = "Default Cycloid with End Angle 720, extruded"
mesh = "mesh.obj"

[params]
type = "extrude"
caps = false
extrude_offset = 20.0

[params.input]
type = "cycloid_spline"
cycloid_type = "cycloid"
radius = 25.0
r = 50.0
a = 75.0
start_angle = 0.0
end_angle = 720.0
plane = "xy"
reverse = false
intermediate = "adaptive"
intermediate_number = 8
intermediate_angle = 5.0
intermediate_max_length = 5.0



[import]
scale = 1.0
flip_z = false
