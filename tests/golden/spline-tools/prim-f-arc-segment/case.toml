feature = "spline-tools"
observation = "docs/parity/spline-tools.md"
description = "Default Arc with Type Segment, extruded"
mesh = "mesh.obj"

[params]
type = "extrude"
caps = false
extrude_offset = 20.0

[params.input]
type = "arc_spline"
arc_type = "segment"
radius = 200.0
inner_radius = 100.0
start_angle = 0.0
end_angle = 90.0
plane = "xy"
reverse = false
intermediate = "uniform"
intermediate_number = 8
intermediate_angle = 5.0
intermediate_max_length = 5.0



[import]
scale = 1.0
flip_z = false
