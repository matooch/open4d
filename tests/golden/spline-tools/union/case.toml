feature = "spline-tools"
observation = "docs/parity/spline-tools.md"
description = "Two default editable circles, the second at x 150, Spline Union (B at x 150 selected first, the circle at the origin added second, measured as a notched/lens outline through an Extrude)"
mesh = "mesh.obj"

[params]
extrude_offset = 20.0
caps = false
command = "spline_union"


[params.input]
type = "circle_spline"
ellipse = false
ring = false
radius = 200.0
radius_y = 200.0
inner_radius = 100.0
plane = "xy"
reverse = false
intermediate = "uniform"
intermediate_number = 8
intermediate_angle = 5.0
intermediate_max_length = 5.0

[params.input2]
type = "circle_spline"
ellipse = false
ring = false
radius = 200.0
radius_y = 200.0
inner_radius = 100.0
plane = "xy"
reverse = false
intermediate = "uniform"
intermediate_number = 8
intermediate_angle = 5.0
intermediate_max_length = 5.0
position = [150.0, 0.0, 0.0]


[import]
scale = 1.0
flip_z = false
