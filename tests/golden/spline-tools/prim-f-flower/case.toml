feature = "spline-tools"
observation = "docs/parity/spline-tools.md"
description = "Flower with Inner Radius 50, Outer Radius 150, 5 Petals, extruded"
mesh = "mesh.obj"

[params]
type = "extrude"
caps = false
extrude_offset = 20.0

[params.input]
type = "flower_spline"
inner_radius = 50.0
outer_radius = 150.0
petals = 5
plane = "xy"
reverse = false
intermediate = "adaptive"
intermediate_number = 8
intermediate_angle = 5.0
intermediate_max_length = 5.0



[import]
scale = 1.0
flip_z = false
