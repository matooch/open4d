feature = "spline-tools"
observation = "docs/parity/spline-tools.md"
description = "Default Circle in the XZ plane (plane enum index 1), extruded with the Extrude Direction auto"
mesh = "mesh.obj"

[params]
type = "extrude"
caps = false
extrude_offset = 20.0

[params.input]
type = "circle_spline"
ellipse = false
ring = false
radius = 200.0
radius_y = 200.0
inner_radius = 100.0
plane = "zy"
reverse = false
intermediate = "uniform"
intermediate_number = 8
intermediate_angle = 5.0
intermediate_max_length = 5.0



[import]
scale = 1.0
flip_z = false
