feature = "spline-tools"
observation = "docs/parity/spline-tools.md"
description = "Default Star with Intermediate Points Uniform, Number 4 (unequal segments), Extrude offset 100"
mesh = "mesh.obj"

[params]
type = "extrude"
caps = false
extrude_offset = 100.0

[params.input]
type = "star_spline"
inner_radius = 100.0
outer_radius = 200.0
twist = 0.0
points = 8
plane = "xy"
reverse = false
intermediate = "adaptive"
intermediate_number = 8
intermediate_angle = 5.0
intermediate_max_length = 5.0



[import]
scale = 1.0
flip_z = false
