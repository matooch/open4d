feature = "soft-bodies"
observation = "docs/parity/soft-bodies.md"
description = "A sphere (radius 50, 16 segments) at (0, 200, 0) with a soft body tag (Made of Polygons/Lines) over the default plane; frames stepped one at a time 0 to 60 at 30 fps; per frame the sphere centre (mean of its points) and its lowest point y, recorded in samples.json as tracks"

[params]
frame = 60
fps = 30
tolerance = 0.001
frames = "0-60 stepped one at a time"
centre = "mean of the sphere points per frame (world)"
lowest_y = "smallest world y over the sphere points"
radius = 50.0
segments = 16
type = "Standard"
render_perfect = true

