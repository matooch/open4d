feature = "mesh-deformer"
observation = "docs/parity/deformers-4.md"
description = "Cage: cube 300x500x300 segments 1/1/1 made editable, linked in the Cages list, initialized; cage point 0 moved by (-100, 0, 0)"
mesh = "mesh.obj"

[params]
auto_init = false
memory = "276 B"
strength_percent = 100.0
accuracy_percent = 10.0
external = "Ignore"
pos = [0.0, 0.0, 0.0]
rot = [0.0, 0.0, 0.0]

[params.cage]
type = "polygon"
position = [0.0, 0.0, 0.0]
rotation_deg = [0.0, 0.0, 0.0]
cage_point0_before = [-150.0, -250.0, -150.0]
cage_point0_after = [-250.0, -250.0, -150.0]

[params.input]
type = "cube"
size_y = 400.0
segments_x = 4
segments_y = 8
segments_z = 4

[import]
scale = 1.0
flip_z = false
