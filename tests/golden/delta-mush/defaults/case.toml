feature = "delta-mush"
observation = "docs/parity/deformers-4.md"
description = "cube made editable (4/8/4 segments), point 0 moved by (80, 80, 80), Delta Mush defaults with Initialize"
mesh = "mesh.obj"

[params]
strength_percent = 100.0
iterations = 10
smooth_view_percent = 0.0
tangent_mode = "Edge"
smooth_type = "Proportional"
pin_border_points = false
p1010 = "Memory Used :  3.80 KB"
mode = "Exclude"
pos = [0.0, 0.0, 0.0]
rot = [0.0, 0.0, 0.0]
input_editable = true
input_point0_moved = [80.0, 80.0, 80.0]

[params.input]
type = "cube"
size_y = 400.0
segments_x = 4
segments_y = 8
segments_z = 4

[import]
scale = 1.0
flip_z = false
