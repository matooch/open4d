feature = "extrude"
observation = "docs/parity/extrude.md"
description = "Extrude Movement (0, 0, 50) of a default Circle spline"
mesh = "mesh.obj"

[params]
movement = [0.0, 0.0, 50.0]
[params.input]
type = "circle_spline"
radius = 200.0
plane = "xy"
