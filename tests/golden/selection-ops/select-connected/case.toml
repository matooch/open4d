feature = "selection-ops"
observation = "docs/parity/selection-ops.md"
description = "Cube made editable with 2 x 2 x 2 segments; the 4 top polygons separated with the Disconnect command (41 points, 24 polygons, same polygon order), then top polygon 16 selected and the Select Connected menu command run once"
mesh = "mesh.obj"

[params]
segments = [2, 2, 2]
command = "Select Connected"
start_points = []
start_edges = []
start_polys = [16]
disconnect_first = true
disconnected_polys = [16, 17, 18, 19]

[import]
scale = 1.0
flip_z = false
