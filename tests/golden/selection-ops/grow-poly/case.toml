feature = "selection-ops"
observation = "docs/parity/selection-ops.md"
description = "Cube made editable with 4 x 4 x 4 segments; the front polygon in the middle (index 5 of the front face) selected in polygon mode, then the Grow Selection modeling command run once with Use Edge on"
mesh = "mesh.obj"

[params]
segments = [4, 4, 4]
command = "Grow Selection"
use_edge = true
start_points = []
start_edges = []
start_polys = [5]

[import]
scale = 1.0
flip_z = false
