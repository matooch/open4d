feature = "selection-ops"
observation = "docs/parity/selection-ops.md"
description = "Cube made editable with 2 x 2 x 2 segments; the 4 top polygons selected, then the Convert Selection command run from polygons to points (tolerant off). The source polygon selection stays selected"
mesh = "mesh.obj"

[params]
segments = [2, 2, 2]
command = "Convert Selection"
start_points = []
start_edges = []
start_polys = [16, 17, 18, 19]
from = "polygons"
to = "points"
tolerant = false

[import]
scale = 1.0
flip_z = false
