feature = "squash-stretch"
observation = "docs/parity/deformers-2.md"
description = "Squash & Stretch, Factor 50 %, Expand (the bulge setting) 100 %, which is also its default"
mesh = "mesh.obj"

[params]
top = 100.0
center_percent = 0.0
bottom = -100.0
aspect_percent = 100.0
factor_percent = 50.0
expand_percent = 100.0
smooth_start_percent = 0.0
smooth_end_percent = 0.0
curvature_percent = 100.0
curvature_type = "Square"
power = 2.0

[params.input]
type = "cube"
size_y = 400.0
segments_x = 4
segments_y = 8
segments_z = 4

[import]
scale = 1.0
flip_z = false
