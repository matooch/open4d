feature = "subdivision"
observation = "docs/parity/generators-3.md"
description = "Subdivision Surface over a default cube, one case per Type option, at the R25 default levels (OpenSubdiv Catmull-Clark)"
mesh = "mesh.obj"

[params]
scheme = "osd_catmull_clark"
r12_compatibility = false
level_view = 2
level_render = 2
subdivide_uvs = "edge"

[params.input]
type = "cube"
pos = [0.0, 0.0, 0.0]
size = [200.0, 200.0, 200.0]
segments_x = 1
segments_y = 1
segments_z = 1
separate_surfaces = false
fillet = false
fillet_radius = 3.0
fillet_subdivision = 3

[import]
scale = 1.0
flip_z = false
