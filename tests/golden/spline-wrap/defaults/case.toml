feature = "spline-wrap"
observation = "docs/parity/deformers-3.md"
description = "Spline Wrap child of the cube; its Spline link set to a default Helix (made through its menu command, at the origin)"
mesh = "mesh.obj"

[params]
axis = "+X"
strength_percent = 100.0
offset_percent = 0.0
from_percent = 0.0
to_percent = 100.0
mode = "Fit Spline"
end_mode = "Extend"
scale_from_rail = false
size_strength_percent = 100.0
spline_size_strength_percent = 100.0
rotation_from_rail = true
up_vector = [0.0, 0.0, 0.0]
banking_deg = 0.0
rotation_strength_percent = 100.0
spline_rotation_strength_percent = 100.0
fix_bounding_box = false
bounding_box_center = [0.0, 0.0, 0.0]
bounding_box_size = [200.0, 200.0, 200.0]

[params.spline]
type = "spline"
start_radius = 200.0
start_angle_deg = 0.0
end_radius = 200.0
end_angle_deg = 720.0
radial_bias_percent = 50.0
height = 200.0
height_bias_percent = 50.0
subdivision = 100
plane = "XY"
reverse = false
intermediate_points = "Uniform"
number = 8
angle_deg = 5.0
maximum_length = 5.0

[params.input]
type = "cube"
size_y = 400.0
segments_x = 4
segments_y = 8
segments_z = 4

[import]
scale = 1.0
flip_z = false
