feature = "polygon-reduction"
observation = "docs/parity/deformers-3.md"
description = "Polygon Reduction (the Legacy Polygon Reduction object, the only one the menu command creates) child of a default sphere (input instead of the cube), default settings"
mesh = "mesh.obj"

[params]
reduction_strength_percent = 90.0
mesh_quality_factor = 1000
co_planar_optimization = true
bounday_curve_preservation = true
polygon_quality_preservation = false

[params.input]
type = "sphere"
radius = 100.0
segments = 16
sphere_type = "Standard"
render_perfect = true

[import]
scale = 1.0
flip_z = false
