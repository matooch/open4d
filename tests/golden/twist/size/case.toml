feature = "twist"
observation = "docs/parity/twist.md"
description = "Twist angle 90, size (100, 200, 100)"
mesh = "mesh.obj"

[params]
angle = 90.0
size = [100.0, 200.0, 100.0]
mode = "limited"
pos = [0.0, 0.0, 0.0]
rot = [0.0, 0.0, 0.0]

[params.input]
type = "cube"
size_y = 400.0
segments_x = 4
segments_y = 8
segments_z = 4

[import]
scale = 1.0
flip_z = false
