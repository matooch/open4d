feature = "boole"
observation = "docs/parity/boole.md"
description = "Boole of default cube A at origin and default cube B at (50, 50, 50), mode intersect"
mesh = "mesh.obj"

[params]
mode = "intersect"
b_pos = [50.0, 50.0, 50.0]

[import]
scale = 1.0
flip_z = false

[tolerance]
compare = "geometric"
