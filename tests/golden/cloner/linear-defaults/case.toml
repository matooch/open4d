feature = "cloner"
observation = "docs/parity/cloner.md"
description = "Cloner in Linear mode, all other parameters at their R25 defaults; child: default cube 20 x 20 x 20"
mesh = "mesh.obj"

[params]
mode = "linear"
clones_mode = "Iterate"
reset_coordinates = true
fix_texture = "Off"
instance_mode = "Instance"
viewport_mode = "Object"
count = 3
offset = 0
linear_mode = "Per Step"
amount_percent = 100.0
step_position = [0.0, 50.0, 0.0]
step_scale_percent = [100.0, 100.0, 100.0]
step_rotation_deg = [0.0, 0.0, 0.0]
step_mode = "Single Value"
step_size_percent = 100.0
step_rotation_per_step_deg = [0.0, 0.0, 0.0]
display = "None"
position = [0.0, 0.0, 0.0]
rotation_deg = [0.0, 0.0, 0.0]
scale = [1.0, 1.0, 1.0]
color = [1.0, 1.0, 1.0]
weight_percent = 0.0
animation_mode = "Play"
effector_count = 0

[import]
scale = 1.0
flip_z = false
