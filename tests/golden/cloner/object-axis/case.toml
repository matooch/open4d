feature = "cloner"
observation = "docs/parity/cloner-3.md"
description = "Object cloner on a default Cube (the cube stays in the scene), 20 cm cube child, Distribution Axis"
mesh = "mesh.obj"

[params]
mode = "object"
clones_mode = "Iterate"
reset_coordinates = true
fix_texture = "Off"
instance_mode = "Instance"
viewport_mode = "Object"
object = "Cube"
align_clone = true
distribution = "Axis"
enable_scaling = false
scale_percent = 100.0
display = "None"
position = [0.0, 0.0, 0.0]
rotation_deg = [0.0, 0.0, 0.0]
scale = [1.0, 1.0, 1.0]
color = [1.0, 1.0, 1.0]
weight_percent = 0.0
animation_mode = "Play"
effector_count = 0

[import]
scale = 1.0
flip_z = false
