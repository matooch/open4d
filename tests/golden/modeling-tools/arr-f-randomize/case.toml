feature = "modeling-tools"
observation = "docs/parity/modeling-tools-3.md"
mesh = "mesh.obj"
description = "Three default cubes (not editable) at the origin; the Randomize command run with seed 1, move range (100, 100, 100), rotate range 30 deg per axis, scale range 0.5 per axis. Resulting transforms in mesh.obj (world-space); a repeat with the same seed is identical. The rotate range is stored in radians by the container (30 was read back as 30 rad by a direct container write), scale range 0.5 gives factors within 1 +/- 0.5"

[params]
tool = "randomize"
segments = []

[params.settings]
seed = 1
move_range = [100.0, 100.0, 100.0]
rotate_range_rad = [0.5235987755982988, 0.5235987755982988, 0.5235987755982988]
scale_range = [0.5, 0.5, 0.5]

[params.settings.dialog_defaults]
move = [0.0, 0.0, 0.0]
scale = [1.0, 1.0, 1.0]
rotate = [0.0, 0.0, 0.0]
seed = 0

[import]
scale = 1.0
flip_z = false
