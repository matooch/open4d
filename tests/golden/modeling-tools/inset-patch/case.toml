feature = "modeling-tools"
observation = "docs/parity/modeling-tools-3.md"
description = "Cube made editable with 3 x 1 x 3 segments; all 9 top polygons ([12, 13, 14, 15, 16, 17, 18, 19, 20]) inset with offset 20 (other settings at their Reset Values defaults)"
mesh = "mesh.obj"

[params]
tool = "inset"
segments = [3, 1, 3]
select_polys = [12, 13, 14, 15, 16, 17, 18, 19, 20]

[params.settings]
offset = 20.0
offset_variation = 0.0
subdivision = 0
create_ngons = false
preserve_groups = true
maximum_angle_deg = 89.0
realtime_update = true

[import]
scale = 1.0
flip_z = false
