feature = "modeling-tools"
observation = "docs/parity/modeling-tools-2.md"
description = "Default cube made editable; top polygon (4) selected and the Disconnect command run with Preserve Groups on"
mesh = "mesh.obj"

[params]
tool = "disconnect"
segments = [1, 1, 1]
select_polys = [4]

[params.settings]
preserve_groups = true

[import]
scale = 1.0
flip_z = false
