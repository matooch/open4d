feature = "modeling-tools"
observation = "docs/parity/modeling-tools-3.md"
description = "Default cube made editable with 3 x 1 x 3 segments; the 8 top polygons around the centre one (a ring with a hole: polygons 12, 13, 14, 15, 17, 18, 19, 20) extruded by 40 with Preserve Groups on (other Extrude settings at their Reset Values defaults)"
mesh = "mesh.obj"

[params]
tool = "extrude"
segments = [3, 1, 3]
select_polys = [12, 13, 14, 15, 17, 18, 19, 20]

[params.settings]
offset = 40.0
offset_variation = 0.0
subdivision = 0
create_ngons = false
preserve_groups = true
create_caps = false
maximum_angle_deg = 91.0
rotation_deg = 0.0
quantize_rotation = true
quantize_angle_deg = 5.0
bevel = 5.0
bevel_variation = 0.0
realtime_update = true

[import]
scale = 1.0
flip_z = false
