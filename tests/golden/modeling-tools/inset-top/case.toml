feature = "modeling-tools"
observation = "docs/parity/modeling-tools.md"
description = "Default cube made editable; top polygon inset (Extrude Inner) by 20"
mesh = "mesh.obj"

[params]
tool = "extrude_inner"
segments = [1, 1, 1]
select_polys = [4]

[params.settings]
offset = 20.0
offset_variation = 0.0
subdivision = 0
create_ngons = false
preserve_groups = true
maximum_angle_deg = 89.0
realtime_update = true

[import]
scale = 1.0
flip_z = false
