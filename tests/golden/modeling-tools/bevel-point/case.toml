feature = "modeling-tools"
observation = "docs/parity/modeling-tools-3.md"
description = "Cube made editable with 1 x 1 x 1 segments; point 3 at (100, 100, -100) beveled in point mode with offset 20 (other settings at their Reset Values defaults)"
mesh = "mesh.obj"

[params]
tool = "bevel"
segments = [1, 1, 1]
select_points = [3]

[params.settings]
bevel_mode = "chamfer"
offset_mode = "fixed_distance"
offset = 20.0
subdivision = 0
depth = 1.0
limit = true
shape = "round"
tension = 1.0
mitering = "default"
ending = "default"
partial_rounding = "none"
corner_ngons = false
rounding_ngons = false
phong_break_rounding = false
phong_break_miters = false
realtime_update = true

[import]
scale = 1.0
flip_z = false
