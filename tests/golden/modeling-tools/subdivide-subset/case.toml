feature = "modeling-tools"
observation = "docs/parity/modeling-tools-3.md"
description = "Default cube made editable (8 points, 6 polygons); the top polygon ([4]) selected and the Subdivide command run with 1 subdivision and Hyper (smoothing) off"
mesh = "mesh.obj"

[params]
tool = "subdivide"
segments = [1, 1, 1]
select_polys = [4]

[params.settings]
subdivisions = 1
hyper = false

[import]
scale = 1.0
flip_z = false
