feature = "modeling-tools"
observation = "docs/parity/modeling-tools-3.md"
description = "Cube made editable with 1 x 1 x 1 segments; only the top polygon ([4]) selected and the Array command run with 2 columns along x and offset (0, 0, 300), scale (1, 1, 1), rotation (0, 0, 0). Result: 12 points, 7 polygons, bbox (-100.0, 100.0, -100.0, 100.0, -100.0, 100.0)"
mesh = "mesh.obj"

[params]
tool = "array_command"
segments = [1, 1, 1]
select_polys = [4]

[params.settings]
count = [2, 1, 1]
offset = [0.0, 0.0, 300.0]
scale = [1.0, 1.0, 1.0]
rotation = [0.0, 0.0, 0.0]

[import]
scale = 1.0
flip_z = false
