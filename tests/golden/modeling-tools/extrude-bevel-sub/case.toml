feature = "modeling-tools"
observation = "docs/parity/modeling-tools-3.md"
description = "Cube made editable with 1 x 1 x 1 segments; the top polygon (4) extruded with offset 50, Subdivision 2 and Bevel 10 (the Extrude tool has no separate Bevel on/off switch: the numeric Bevel 2169 is the option, driven like the older extrude-bevel case)"
mesh = "mesh.obj"

[params]
tool = "extrude"
segments = [1, 1, 1]
select_polys = [4]

[params.settings]
offset = 50.0
offset_variation = 0.0
subdivision = 2
create_ngons = false
preserve_groups = true
create_caps = false
maximum_angle_deg = 91.0
rotation_deg = 0.0
quantize_rotation = true
quantize_angle_deg = 5.0
bevel = 10.0
bevel_variation = 0.0
realtime_update = true

[import]
scale = 1.0
flip_z = false
