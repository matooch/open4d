feature = "modeling-tools"
observation = "docs/parity/modeling-tools-3.md"
description = "Default pyramid made editable; the two base edges meeting at the corner point 2 (points [(2, 1), (2, 3)]) beveled with offset 20, Subdivision 2, Mitering Uniform (other settings at their Reset Values defaults)"
mesh = "mesh.obj"

[params]
tool = "bevel"
segments = []
select_edges = [[2, 1], [2, 3]]

[params.settings]
bevel_mode = "chamfer"
offset_mode = "fixed_distance"
offset = 20.0
subdivision = 2
depth = 1.0
limit = true
shape = "round"
tension = 1.0
mitering = "uniform"
ending = "default"
partial_rounding = "none"
corner_ngons = false
rounding_ngons = false
phong_break_rounding = false
phong_break_miters = false
realtime_update = true

[params.primitive]
type = "pyramid"
corner_point = 2
edge_pairs = [[2, 1], [2, 3]]

[import]
scale = 1.0
flip_z = false
