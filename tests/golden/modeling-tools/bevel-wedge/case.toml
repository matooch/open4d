feature = "modeling-tools"
observation = "docs/parity/modeling-tools-3.md"
description = "Default pyramid made editable; one base edge (the +x base edge between points 1 and 2) beveled with offset 20, Subdivision 2 (other settings at their Reset Values defaults)"
mesh = "mesh.obj"

[params]
tool = "bevel"
segments = []
select_edges = [[1, 2]]

[params.settings]
bevel_mode = "chamfer"
offset_mode = "fixed_distance"
offset = 20.0
subdivision = 2
depth = 1.0
limit = true
shape = "round"
tension = 1.0
mitering = "default"
ending = "default"
partial_rounding = "none"
corner_ngons = false
rounding_ngons = false
phong_break_rounding = false
phong_break_miters = false
realtime_update = true

[params.primitive]
type = "pyramid"
points = [[-100.0, -100.0, -100.0], [100.0, -100.0, -100.0], [100.0, -100.0, 100.0], [-100.0, -100.0, 100.0], [0.0, 100.0, 0.0]]

[import]
scale = 1.0
flip_z = false
