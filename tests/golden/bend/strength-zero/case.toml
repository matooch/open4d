feature = "bend"
observation = "docs/parity/bend.md"
description = "Bend strength 0 with angle 45: alpha = 0 means no deformation regardless of the angle"
mesh = "mesh.obj"

[params]
strength = 0.0
size = [250.0, 250.0, 250.0]
mode = "limited"
angle = 45.0
keep_y_axis_length = false
pos = [0.0, 0.0, 0.0]
rot = [0.0, 0.0, 0.0]

[params.input]
type = "cube"
size_y = 400.0
segments_x = 4
segments_y = 8
segments_z = 4

[import]
scale = 1.0
flip_z = false
