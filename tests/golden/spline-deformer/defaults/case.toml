feature = "spline-deformer"
observation = "docs/parity/deformers-4.md"
description = "Default Arc spline as Original Spline, the same Arc rotated H 90 as Modifying Spline, both linked"
mesh = "mesh.obj"

[params]
original_spline = "Arc"
modifying_spline = "Arc.1"
b_spline_approximation = 10
radius = 30.0
use_length = false
full_polygons = false
pos = [0.0, 0.0, 0.0]
rot = [0.0, 0.0, 0.0]

[params.original_spline]
type = "arc"
position = [0.0, 0.0, 0.0]
rotation_deg = [0.0, 0.0, 0.0]
radius = 200.0
inner_radius = 100.0
start_angle_deg = 0.0
end_angle_deg = 90.0
plane = "XY"
reverse = false
intermediate_points = "Uniform"
number = 8
angle_deg = 5.0
maximum_length = 5.0

[params.modifying_spline]
type = "arc"
position = [0.0, 0.0, 0.0]
rotation_deg = [0.0, 90.0, 0.0]
radius = 200.0
inner_radius = 100.0
start_angle_deg = 0.0
end_angle_deg = 90.0
plane = "XY"
reverse = false
intermediate_points = "Uniform"
number = 8
angle_deg = 5.0
maximum_length = 5.0

[params.input]
type = "cube"
size_y = 400.0
segments_x = 4
segments_y = 8
segments_z = 4

[import]
scale = 1.0
flip_z = false
