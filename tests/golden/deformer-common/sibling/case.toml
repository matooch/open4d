feature = "deformer-common"
observation = "docs/parity/deformer-common.md"
description = "Null > Cube, Bend (90): Bend is a sibling of the cube under a Null"
mesh = "mesh.obj"

[params]
hierarchy = "Null > Cube, Bend"

[params.input]
type = "cube"
size_y = 400.0
segments_x = 4
segments_y = 8
segments_z = 4
