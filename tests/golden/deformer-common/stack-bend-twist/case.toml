feature = "deformer-common"
observation = "docs/parity/deformer-common.md"
description = "Cube > Bend (90), Twist (90): both children of the cube, Bend first"
mesh = "mesh.obj"

[params]
hierarchy = "Cube > Bend, Twist"

[params.input]
type = "cube"
size_y = 400.0
segments_x = 4
segments_y = 8
segments_z = 4

[params.input2]
type = "bend"
strength = 90.0
size = [250.0, 250.0, 250.0]
mode = "limited"
angle = 0.0
keep_y_axis_length = false
pos = [0.0, 0.0, 0.0]
rot = [0.0, 0.0, 0.0]
parent = "input"

[params.input3]
type = "twist"
angle = 90.0
size = [250.0, 250.0, 250.0]
mode = "limited"
pos = [0.0, 0.0, 0.0]
rot = [0.0, 0.0, 0.0]
parent = "input"

[import]
scale = 1.0
flip_z = false
