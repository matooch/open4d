feature = "text"
observation = "docs/parity/text.md"
description = "letter O, font left at the app default (script-set fonts do not affect the outline on this build)"
mesh = "mesh.obj"

[params]
extrude_offset = 20.0
caps = false

[params.input]
type = "text_spline"
text = "O"
align = "left"
height = 200.0
horizontal_spacing = 0.0
vertical_spacing = 0.0
separate_letters = false
plane = "xy"
reverse = false
intermediate = "adaptive"
intermediate_number = 8
intermediate_angle = 5.0
intermediate_max_length = 5.0
font = "default"

[import]
scale = 1.0
flip_z = false
