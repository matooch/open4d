feature = "animation-2"
observation = "docs/parity/animation-2.md"
description = "Cube with an Align to Spline tag on a default Circle spline (radius 200); tag Position keyed 0 % at f0 and 100 % at f90"

[params]
param = ["pos_x", "pos_y", "pos_z"]
tag = "Align to Spline"
tag_plugin_id = 5699
spline = "Circle"
spline_plugin_id = 5181
spline_radius = 200.0
tangential = false
position_keys = [[0, 0.0], [90, 1.0]]
object = "Cube"
document_fps = 30
sample_frames = ["0..90 every frame", "plus 0.5, 14.5, 29.5"]
