feature = "sweep"
observation = "docs/parity/generators-3.md"
description = "Sweep with default Circle profile, default Helix path, and a second default Helix with End Radius 400 as rail spline, R25 defaults"
mesh = "mesh.obj"

[params]
isoparm_subdivision = 10
end_scale = 100.0
end_rotation = 0.0
start_growth = 0.0
end_growth = 100.0
parallel_movement = false
constant_cross_section = true
banking = true
keep_segments = false
use_rail_direction = true
two_rail = true
use_rail_scale = true
flip_normals = false
stick_uvs = false

[params.input]
type = "circle_spline"
pos = [0.0, 0.0, 0.0]
ellipse = false
ring = false
radius = 200.0
radius_y = 200.0
inner_radius = 100.0
plane = "xy"
reverse = false
intermediate = "uniform"
intermediate_number = 8
intermediate_angle = 5.0
intermediate_max_length = 5.0

[params.input2]
type = "helix_spline"
pos = [0.0, 0.0, 0.0]
start_radius = 200.0
start_angle = 0.0
end_radius = 200.0
end_angle = 720.0
radial_bias = 50.0
height = 200.0
height_bias = 50.0
subdivision = 100
plane = "xy"
reverse = false
intermediate = "uniform"
intermediate_number = 8
intermediate_angle = 5.0
intermediate_max_length = 5.0

[params.input3]
type = "helix_spline"
pos = [0.0, 0.0, 0.0]
start_radius = 200.0
start_angle = 0.0
end_radius = 400.0
end_angle = 720.0
radial_bias = 50.0
height = 200.0
height_bias = 50.0
subdivision = 100
plane = "xy"
reverse = false
intermediate = "uniform"
intermediate_number = 8
intermediate_angle = 5.0
intermediate_max_length = 5.0

[import]
scale = 1.0
flip_z = false
