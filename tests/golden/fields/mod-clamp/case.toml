feature = "fields"
observation = "docs/parity/fields-4.md"
description = "Spherical field (Size 200) at the origin with a Clamp modifier layer above it, all defaults"

[params]
type = "spherical"
size = 200.0
clip_to_shape = false
enable_remapping = true
mirror_graph = true
strength_percent = 100.0
invert = false
inner_offset_percent = 50.0
min_percent = 0.0
clamp_min = true
max_percent = 100.0
clamp_max = true
multiplier_percent = 100.0
contour_mode = "None"
curve_percent = 0.0
steps = 1
spline_offset_percent = 0.0
spline_range_percent = 100.0
color_mode = "Color"
length_mode = "Use Value"
length_scale_percent = 100.0
invert_direction = true
strength_mode = "No Remap"
strength_scale_percent = 100.0
invert_rotations = false
layers_top_to_bottom = ["Clamp", "Spherical"]
layer_blend_modes_top_to_bottom = ["Normal", "Normal"]
layer_strength_percent_top_to_bottom = [100.0, 100.0]
Clamp_minimum = 0.0
Clamp_clamp_min = true
Clamp_maximum = 100.0
Clamp_clamp_max = true

[import]
scale = 1.0
flip_z = false
