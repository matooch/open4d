feature = "fields"
observation = "docs/parity/fields-4.md"
description = "Spherical (radius 200) moving from x -200 at frame 0 to x 200 at frame 30, Delay layer above it at defaults, sampled at frame 20 after stepping frame by frame from 0"

[params]

[params.field]
type = "spherical"
size = 200.0
clip_to_shape = false
enable_remapping = true
mirror_graph = true
strength_percent = 100.0
invert = false
inner_offset_percent = 50.0
min_percent = 0.0
clamp_min = true
max_percent = 100.0
clamp_max = true
multiplier_percent = 100.0
contour_mode = "None"
curve_percent = 0.0
steps = 1
spline_offset_percent = 0.0
spline_range_percent = 100.0
color_mode = "Color"
length_mode = "Use Value"
length_scale_percent = 100.0
invert_direction = true
strength_mode = "No Remap"
strength_scale_percent = 100.0
invert_rotations = false
position_x_frame0 = -200.0
position_x_frame30 = 200.0
sample_frame = 20
layer_strength_percent = 100.0
layer_blend_mode = "Normal"

[params.modifier]
shown_name = "Delay"
mode = "Smooth"
effect_strength = 0.5
nested_field_list_present = true
layer_opacity_percent = 100.0
layer_blend_mode = "Normal"

[import]
scale = 1.0
flip_z = false
