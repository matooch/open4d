feature = "smoothing-deformer"
observation = "docs/parity/deformers-3.md"
description = "Cube 200 x 400 x 200 with segments 4/4/4 and Fillet off, made editable, point 0 moved from (-100.0, -200.0, -100.0) by (50, 50, 50); Smoothing deformer child, default settings"
mesh = "mesh.obj"

[params]
iterations = 10
strength_percent = 100.0
stiffness_percent = 30.0
type = "smooth"
keep_displacements = false

[params.input]
type = "cube_editable"
size_y = 400.0
segments_x = 4
segments_y = 4
segments_z = 4
fillet = false
point_0_moved = [50.0, 50.0, 50.0]

[import]
scale = 1.0
flip_z = false
