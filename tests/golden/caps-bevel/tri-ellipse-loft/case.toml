feature = "caps-bevel"
observation = "docs/parity/caps-bevel.md"
description = "Loft of two Circle splines turned into ellipses (Ellipse on, Radius 200, Radius Y 100), Start and End Cap on, Caps Type Triangles"
mesh = "mesh.obj"

[params]
type = "loft"
mesh_subdivision_u = 16
mesh_subdivision_v = 4
isoparm_subdivision_u = 10
organic_form = false
subdivision_per_segment = true
loop = false
linear_interpolation = false
adapt_uv = true
flip_normals = false
caps_type = "Triangles"
start_cap = true
end_cap = true
caps_grid_size = 10.0
caps_density = 0.2
quad_dominant = false
separate_bevel_controls = false
bevel_shape = "Round"
bevel_size = 0.0
bevel_extended_shape = false
bevel_height = 0.0
bevel_shape_depth = 1.0
bevel_segments = 3.0
end_bevel_shape = "Round"
end_bevel_size = 0.0
end_bevel_extended_shape = false
end_bevel_height = 0.0
end_bevel_shape_depth = 1.0
end_bevel_segments = 3.0
bevel_outside = false
break_phong_rounding = true
avoid_self_intersections = true
polygon_selection_shell = false
polygon_selection_start_cap = false
polygon_selection_end_cap = false
polygon_selection_start_bevel = false
polygon_selection_end_bevel = false
edge_selection_start_shell = false
edge_selection_end_shell = false
edge_selection_start_cap = false
edge_selection_end_cap = false
edge_selection_start_step = false
edge_selection_end_step = false

[params.input]
type = "circle"
ellipse = true
ring = false
radius = 200.0
radius_y = 100.0
inner_radius = 100.0
plane = "XY"
reverse = false
intermediate = "Uniform"
intermediate_number = 8
intermediate_angle = 5.0
intermediate_max_length = 5.0

[params.input2]
type = "circle"
ellipse = true
ring = false
radius = 200.0
radius_y = 100.0
inner_radius = 100.0
plane = "XY"
reverse = false
intermediate = "Uniform"
intermediate_number = 8
intermediate_angle = 5.0
intermediate_max_length = 5.0

[import]
scale = 1.0
flip_z = false
