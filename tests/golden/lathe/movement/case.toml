feature = "lathe"
observation = "docs/parity/generators-3.md"
description = "Lathe with a default Rectangle at x 300 (Plane XY), Movement 200"
mesh = "mesh.obj"

[params]
angle = 360.0
subdivision = 32
isoparm_subdivision = 10
movement = 200.0
scaling = 100.0
flip_normals = false

[params.input]
type = "rectangle_spline"
pos = [300.0, 0.0, 0.0]
width = 400.0
height = 400.0
rounding = false
rounding_radius = 50.0
plane = "xy"
reverse = false
intermediate = "adaptive"
intermediate_number = 8
intermediate_angle = 5.0
intermediate_max_length = 5.0

[import]
scale = 1.0
flip_z = false
